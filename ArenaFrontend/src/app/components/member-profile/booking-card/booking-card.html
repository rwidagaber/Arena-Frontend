<div class="booking-card">
  <div class="card-glow"></div>
  <div class="card-main">
    <div class="card-header-row">
      <span [class]="statusClass()">
        @if (statusLabel() === 'Confirmed') {
          {{ 'upcoming' | translate }}
        } @else if (statusLabel() === 'Cancelled') {
          {{ 'error' | translate }}
        } @else {
          {{ 'past' | translate }}
        }
      </span>
    </div>

    <div class="booking-info-block">
      <div class="date-info">
        <svg class="calendar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span class="date-text">{{ booking().bookingDate | date:'fullDate' }}</span>
      </div>
      
      <div class="time-info">
        <svg class="clock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        <span class="time-text">{{ booking().startTime }}</span>
      </div>
    </div>

    @if (isCancelable()) {
      <div class="card-footer">
        <button class="btn-cancel-booking" (click)="onCancelClick()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
            <circle cx="12" cy="12" r="10"/>
            <line x1="15" y1="9" x2="9" y2="15"/>
            <line x1="9" y1="9" x2="15" y2="15"/>
          </svg>
          {{ 'bookingDetails' | translate }}
        </button>
      </div>
    }
  </div>
</div>
