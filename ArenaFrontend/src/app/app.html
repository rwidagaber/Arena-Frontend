@if(showLayout){
<app-header></app-header>
}

<!-- The routed component renders inside this shell (Angular inserts it as the
     outlet's DOM sibling). The min-height floor guarantees the footer starts
     below the fold even while a lazy route/its data is still loading, so it
     can never flash at the top of the viewport on refresh — and its scroll
     reveal can't be consumed early by that flash. -->
<div class="route-shell">
  <router-outlet (activate)="onOutletActivate()"></router-outlet>
</div>

<!-- Global subscriber sidebar: on every page (except the dashboard, which has
     its own) when the signed-in user has an active subscription. -->
@if (showLayout && !isDashboard && (currentUser$ | async)?.isSubscribed) {
<app-dashboard-sidebar [activeSection]="null" (sectionChange)="goToSection($event)"></app-dashboard-sidebar>
}

@if(showLayout && !isChat){
<app-floating-chat-button></app-floating-chat-button>
}

@if(showLayout){
<app-back-to-top></app-back-to-top>
}

@if(showLayout && showFooter && !isChat && contentReady){
<app-footer></app-footer>
}

<app-custom-alert></app-custom-alert>
