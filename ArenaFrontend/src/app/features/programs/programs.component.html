<section class="programs-section">
  <div class="section-header" appScrollReveal [revealDelay]="0">
    <div class="badge">
      <span class="dot"></span>
      {{ 'PROGRAMS.BADGE' | translate }}
    </div>
    <h2 class="section-title">
      {{ 'PROGRAMS.TITLE' | translate }}
    </h2>
  </div>

  <div class="programs-grid">
    @for (program of programs; track program.title; let i = $index) {
      <div class="program-card" appScrollReveal [revealDelay]="i * 150">
        <div class="card-header">
          <img [src]="program.image" [alt]="program.title | translate" class="program-image" onerror="this.src='assets/images/placeholder.png'; this.onerror=null;" />
        </div>
        <div class="card-content">
          <h3 class="card-title">{{ program.title | translate }}</h3>
          <p class="card-description">{{ program.description | translate }}</p>
          <a [routerLink]="program.route" class="view-link">
            {{ 'PROGRAMS.VIEW_PROGRAM' | translate }}
            <span class="arrow-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg>
            </span>
          </a>
        </div>
      </div>
    }
  </div>
</section>
