<div class="bell-wrapper">
  <button class="bell-btn" [class.has-unread]="svc.unreadCount() > 0"
          aria-label="Notifications" (click)="toggle($event)">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
         viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
    </svg>
    @if (svc.unreadCount() > 0) {
      <span class="bell-badge">{{ svc.unreadCount() > 9 ? '9+' : svc.unreadCount() }}</span>
    }
  </button>

  @if (open()) {
    <div class="notif-panel" (click)="$event.stopPropagation()">
      <div class="notif-header">
        <span class="notif-title">Notifications</span>
        @if (svc.unreadCount() > 0) {
          <button class="notif-mark-all" (click)="svc.markAllAsRead()">Mark all read</button>
        }
      </div>

      <div class="notif-list">
        @if (svc.notifications().length === 0) {
          <div class="notif-empty">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <p>No notifications yet</p>
          </div>
        }

        @for (n of svc.notifications(); track n.id) {
          <div class="notif-item" [class.unread]="!n.isRead" [class.expanded]="isExpanded(n.id)">
            <button type="button" class="notif-row" (click)="toggleNotif(n)">
              <span class="notif-dot" [ngClass]="dotClass(n.type)"></span>
              <span class="notif-item-title">{{ n.title }}</span>
              <svg class="notif-chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                   viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </button>

            @if (isExpanded(n.id)) {
              <div class="notif-details">
                <p class="notif-item-msg">{{ n.message }}</p>
                <p class="notif-item-time">{{ timeAgo(n.createdAt) }}</p>
              </div>
            }
          </div>
        }
      </div>
    </div>
  }
</div>
