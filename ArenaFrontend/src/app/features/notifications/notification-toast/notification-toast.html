<div class="toast-stack" aria-live="polite">
  @for (n of svc.toasts(); track n.id) {
    <div class="toast-card" (click)="open(n)">
      <span class="toast-dot" [ngClass]="dotClass(n.type)"></span>
      <div class="toast-body">
        <p class="toast-title">{{ n.title }}</p>
        <p class="toast-msg">{{ n.message }}</p>
      </div>
      <button type="button" class="toast-close" (click)="dismiss(n, $event)" aria-label="Dismiss">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  }
</div>
