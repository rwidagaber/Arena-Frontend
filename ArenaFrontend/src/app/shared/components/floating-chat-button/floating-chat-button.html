<!-- Floating AI Chat Button -->
@if (!isHidden) {
  <!-- FAB Button -->
  <button
    class="fab-chat"
    [class.fab-loading]="isLoading"
    (click)="onFabClick()"
    (mouseenter)="showTooltip = true"
    (mouseleave)="showTooltip = false"
    [attr.aria-label]="'FLOATING_CHAT.TOOLTIP' | translate"
    tabindex="0">

    <!-- Loading spinner -->
    @if (isLoading) {
      <div class="fab-spinner">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" stroke-dasharray="31.4" stroke-dashoffset="10" stroke-linecap="round"/>
        </svg>
      </div>
    } @else {
      <!-- Chat AI Icon -->
      <svg class="fab-icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        <circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>
        <circle cx="8" cy="12" r="1" fill="currentColor" stroke="none"/>
        <circle cx="16" cy="12" r="1" fill="currentColor" stroke="none"/>
      </svg>
    }

    <!-- Tooltip -->
    <span class="fab-tooltip" [class.fab-tooltip-visible]="showTooltip && !isLoading">
      {{ 'FLOATING_CHAT.TOOLTIP' | translate }}
    </span>
  </button>

  <!-- Access Denied Modal -->
  @if (showModal) {
    <div class="fab-modal-overlay" (click)="closeModal()" role="dialog" aria-modal="true">
      <div class="fab-modal-card" (click)="$event.stopPropagation()">
        <button class="fab-modal-close" (click)="closeModal()" aria-label="Close">&times;</button>

        <!-- Icon -->
        <div class="fab-modal-icon">
          <svg viewBox="0 0 64 64" width="72" height="72" fill="none">
            <circle cx="32" cy="32" r="28" fill="#D4FA24" opacity="0.12"/>
            <circle cx="32" cy="32" r="24" stroke="#D4FA24" stroke-width="2.5" opacity="0.4"/>
            <!-- Chat bubble -->
            <path d="M44 28a12 12 0 0 0-24 0c0 5.2 3.4 9.6 8 11.2V44l5-4h3a12 12 0 0 0 8-11.2 12 12 0 0 0 0-.8z" stroke="#D4FA24" stroke-width="2" stroke-linejoin="round"/>
            <!-- AI sparkle -->
            <path d="M32 24v8M28 28h8" stroke="#D4FA24" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>

        <!-- Content -->
        <h3 class="fab-modal-title">{{ 'FLOATING_CHAT.MODAL_TITLE' | translate }}</h3>
        <p class="fab-modal-desc">{{ 'FLOATING_CHAT.MODAL_DESC' | translate }}</p>

        <!-- Buttons -->
        <div class="fab-modal-actions">
          <button class="fab-modal-btn fab-modal-btn-primary" (click)="goToSubscription()">
            {{ 'FLOATING_CHAT.BTN_SUBSCRIBE' | translate }}
          </button>
          <button class="fab-modal-btn fab-modal-btn-secondary" (click)="stayHome()">
            {{ 'FLOATING_CHAT.BTN_STAY' | translate }}
          </button>
        </div>
      </div>
    </div>
  }
}
